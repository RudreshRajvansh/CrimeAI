# ==============================================================================
# CrimeAI – NGINX Production Config
# infrastructure/nginx/nginx.prod.conf
#
# Features:
#   - SSL/TLS termination (Let's Encrypt)
#   - HTTP → HTTPS redirect
#   - Gzip compression
#   - Static file caching
#   - Security headers (HSTS, CSP, etc.)
#   - Rate limiting per zone
#   - WebSocket upgrade
# ==============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":"$status",'
        '"bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;
    keepalive_requests 1000;
    server_tokens off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/plain
        image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=ml:10m rate=20r/m;
    limit_req_status 429;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream – multiple backend instances for horizontal scaling
    upstream crimeai_backend {
        least_conn;
        server backend:8000 max_fails=3 fail_timeout=30s;
        # Add more servers here for horizontal scaling:
        # server backend2:8000 max_fails=3 fail_timeout=30s;
        # server backend3:8000 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Main HTTPS server
    server {
        listen 443 ssl http2;
        server_name crimeai.yourdomain.com;  # ← Update this

        # SSL – Let's Encrypt certs (use certbot)
        ssl_certificate /etc/letsencrypt/live/crimeai.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/crimeai.yourdomain.com/privkey.pem;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' wss:;" always;

        client_max_body_size 15M;
        limit_conn conn_limit 50;

        # ------------------------------------------------------------------
        # Frontend (React build – served by Vercel, but kept here for
        # self-hosted deployments)
        # ------------------------------------------------------------------
        location / {
            root /var/www/crimeai/frontend/dist;
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # Immutable assets (hashed filenames from Vite)
        location /assets/ {
            root /var/www/crimeai/frontend/dist;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ------------------------------------------------------------------
        # API
        # ------------------------------------------------------------------
        location /api/ {
            limit_req zone=api burst=100 nodelay;

            proxy_pass http://crimeai_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://crimeai_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/(ml|nlp)/ {
            limit_req zone=ml burst=20 nodelay;
            proxy_pass http://crimeai_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;   # ML endpoints can be slow
        }

        # ------------------------------------------------------------------
        # WebSockets
        # ------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://crimeai_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        # ------------------------------------------------------------------
        # Health (no rate limit, no auth)
        # ------------------------------------------------------------------
        location /health {
            proxy_pass http://crimeai_backend;
            proxy_http_version 1.1;
            access_log off;
            allow all;
        }

        location /ready {
            proxy_pass http://crimeai_backend;
            proxy_http_version 1.1;
            access_log off;
        }

        # ------------------------------------------------------------------
        # Block OpenAPI in production (FastAPI also does this)
        # ------------------------------------------------------------------
        location ~ ^/(docs|redoc|openapi.json) {
            return 404;
        }

        error_page 429 /429.json;
        location = /429.json {
            return 429 '{"detail":"Rate limit exceeded. Please slow down."}';
            default_type application/json;
        }

        error_page 502 503 504 /50x.json;
        location = /50x.json {
            return 502 '{"detail":"Service temporarily unavailable."}';
            default_type application/json;
        }
    }
}
